<title>3D 攝影機預演工具</title>
<style>

  main{max-width:700px;width:100%;background:#1b252e;border:1px solid #35424a;border-radius:18px;padding:clamp(22px,4vw,40px);}

  p{color:#b7c8ce;line-height:1.75;}
  a{display:inline-flex;align-items:center;background:#edb56d;color:#201b16;text-decoration:none;font-weight:800;border-radius:9px;padding:14px 20px;margin-top:13px;}
  a:focus-visible{outline:3px solid white;outline-offset:4px}
  .detail{font-size:13px;border-top:1px solid #35424a;padding-top:20px;margin-top:24px;}

<body>
<main>
  <h1>3D 攝影機預演工具</h1>
  <p>固定 3D 房間與半開房門，調整攝影機位置、方向與視角。畫面在你的瀏覽器即時更新，不需要 AI Agent、Flow 或 PixVerse 額度。</p>
  <a href="./s01-camera/">開啟 S01 房間攝影機編輯器 →</a>
  <p class="detail">已接受的 S01 鏡位是預設起點。調整參數會保存在目前瀏覽器，不會自動同步到其他裝置。這只是幾何構圖輔助工具，不是完成的分鏡或影片。</p>
</main>
